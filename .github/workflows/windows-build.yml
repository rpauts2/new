name: Windows desktop build

on:
  workflow_dispatch:
  push:
    branches:
      - "improve/mission-build-advisor"
    paths:
      - "warframe_companion/**"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packager
        run: python -m pip install --upgrade pyinstaller
      - name: Build Windows app
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name WarframeCompanion warframe_companion/gui.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: WarframeCompanion-windows-x64
          path: dist/WarframeCompanion.exe
          if-no-files-found: error
          retention-days: 14
